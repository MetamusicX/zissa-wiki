name: wiki

# Runs on this template and, unchanged, on every fork: once your own pages are in
# wiki/, each push is checked for broken links, bad frontmatter and misquotes.

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pdftotext (for quote checks against PDFs)
        run: sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Tool tests
        if: hashFiles('tests/test_wiki.py') != ''
        run: python -m unittest discover tests -v
      - name: wiki lint
        run: python scripts/wiki.py lint --min-severity warn
      - name: wiki quotes
        run: python scripts/wiki.py quotes --min-severity warn
